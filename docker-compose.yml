networks:
  ragnet:

volumes:
  postgres-data: {}
  es-data: {}
  ollama-data: {}
  redis-data: {}
  kafka-data: {}

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: qsint-rag-postgres
    networks: [ragnet]
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-qf}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-qf}"
      POSTGRES_DB: "${POSTGRES_DB:-qsint_rag}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qf} -d ${POSTGRES_DB:-qsint_rag}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ── Elasticsearch ───────────────────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: qsint-rag-es
    networks: [ragnet]
    ports:
      - "${ES_PORT:-9200}:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx1g
      - cluster.name=qsint-rag
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # ── Ollama (Qwen local LLM) ─────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: qsint-rag-ollama
    networks: [ragnet]
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    # GPU passthrough — requires nvidia-container-toolkit on host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      # Sequential processing (LLM_PARALLEL=1 in app — no benefit from >1 slot here)
      # More parallel slots = more KV cache reserved = less VRAM for model weights
      - OLLAMA_NUM_PARALLEL=1
      # Flash attention: O(n) memory prefill instead of O(n²) — huge for large prompts
      - OLLAMA_FLASH_ATTN=1
      # Quantize the KV cache from f16 → q8_0, cuts per-slot VRAM by ~50%
      - OLLAMA_KV_CACHE_TYPE=q8_0
      - LLM_MODEL=${LLM_MODEL:-qwen2.5:3b-instruct}
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # ── Model Puller — primary model ──────────────────────────────────────────
  # Pulls the primary model and configures it with:
  #   num_ctx   65536  — 64k context window (q8 KV cache keeps VRAM under 4GB on 3080)
  #   num_predict 2048 — max output tokens (JSON responses rarely exceed 500 tokens)
  #   num_batch   512  — prompt-eval batch size, tuned for RTX 3080
  # Flash attention (OLLAMA_FLASH_ATTN) and q8 KV (OLLAMA_KV_CACHE_TYPE) are set
  # on the ollama service, making 64k context practical.
  ollama-pull-model:
    image: ollama/ollama:latest
    container_name: qsint-rag-ollama-puller
    networks: [ragnet]
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    environment:
      - OLLAMA_HOST=ollama:11434
      - LLM_MODEL=${LLM_MODEL:-qwen2.5:3b-instruct}
    command: >
      "echo 'Pulling $LLM_MODEL...' &&
       ollama pull $LLM_MODEL &&
       echo 'Configuring $LLM_MODEL...' &&
       printf 'FROM %s\nPARAMETER num_ctx 32768\nPARAMETER num_predict 4096\nPARAMETER num_batch 1024\nPARAMETER kv_cache_type q4_0\nPARAMETER temperature 0.1\nPARAMETER top_p 0.9\nPARAMETER repeat_penalty 1.2\n' \"$LLM_MODEL\" > /tmp/Modelfile &&
       ollama create $LLM_MODEL -f /tmp/Modelfile &&
       echo 'Primary model ready: ctx=32768 batch=1024 kv=q4_0 penalty=1.2'"

  # ── Model Puller — phi4-mini (Microsoft, 3.8B, 128k ctx, fast structured output)
  ollama-pull-phi4-mini:
    image: ollama/ollama:latest
    container_name: qsint-rag-ollama-puller-phi4
    networks: [ragnet]
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    environment:
      - OLLAMA_HOST=ollama:11434
    command: >
      "echo 'Pulling phi4-mini...' &&
       ollama pull phi4-mini &&
       printf 'FROM phi4-mini\nPARAMETER num_ctx 32768\nPARAMETER num_predict 4096\nPARAMETER num_batch 1024\nPARAMETER kv_cache_type q4_0\nPARAMETER temperature 0.1\nPARAMETER top_p 0.9\nPARAMETER repeat_penalty 1.2\n' > /tmp/Modelfile_phi4 &&
       ollama create phi4-mini -f /tmp/Modelfile_phi4 &&
       echo 'phi4-mini ready'"

  # ── Model Puller — gemma3:4b (Google, 4B, 128k ctx, excellent quality/speed)
  ollama-pull-gemma3:
    image: ollama/ollama:latest
    container_name: qsint-rag-ollama-puller-gemma3
    networks: [ragnet]
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    environment:
      - OLLAMA_HOST=ollama:11434
    command: >
      "echo 'Pulling gemma3:4b...' &&
       ollama pull gemma3:4b &&
       printf 'FROM gemma3:4b\nPARAMETER num_ctx 32768\nPARAMETER num_predict 4096\nPARAMETER num_batch 1024\nPARAMETER kv_cache_type q4_0\nPARAMETER temperature 0.1\nPARAMETER top_p 0.9\nPARAMETER repeat_penalty 1.2\n' > /tmp/Modelfile_gemma3 &&
       ollama create gemma3:4b -f /tmp/Modelfile_gemma3 &&
       echo 'gemma3:4b ready'"

  # ── Jaeger (OTLP tracing) ───────────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.56
    container_name: qsint-rag-jaeger
    networks: [ragnet]
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:16686/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Kafka (KRaft mode, no Zookeeper) ────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: qsint-rag-kafka
    networks: [ragnet]
    ports:
      - "9094:9094"
    environment:
      # KRaft — no Zookeeper required
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qg"
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  # ── Kafka UI ─────────────────────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: qsint-rag-kafka-ui
    networks: [ragnet]
    ports:
      - "${KAFKA_UI_PORT:-8090}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: qsint-rag
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    restart: unless-stopped

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: qsint-rag-redis
    networks: [ragnet]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ── pgAdmin ──────────────────────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: qsint-rag-pgadmin
    networks: [ragnet]
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_DEFAULT_EMAIL:-qf@qsint.com}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_DEFAULT_PASSWORD:-qf}"
    depends_on:
      - postgres
    restart: unless-stopped

  # ── Kibana ───────────────────────────────────────────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: qsint-rag-kibana
    networks: [ragnet]
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    environment:
      ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

