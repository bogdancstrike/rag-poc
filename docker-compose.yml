networks:
  ragnet:

volumes:
  postgres-data: {}
  es-data: {}
  ollama-data: {}

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: qsint-rag-postgres
    networks: [ragnet]
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-qf}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-qf}"
      POSTGRES_DB: "${POSTGRES_DB:-qsint_rag}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qf} -d ${POSTGRES_DB:-qsint_rag}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ── Elasticsearch ───────────────────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: qsint-rag-es
    networks: [ragnet]
    ports:
      - "${ES_PORT:-9200}:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx1g
      - cluster.name=qsint-rag
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # ── Ollama (Qwen local LLM) ─────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: qsint-rag-ollama
    networks: [ragnet]
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    # GPU passthrough — requires nvidia-container-toolkit on host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=2
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # ── Jaeger (OTLP tracing) ───────────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.56
    container_name: qsint-rag-jaeger
    networks: [ragnet]
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:16686/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qsint-rag-backend
    networks: [ragnet]
    ports:
      - "${API_PORT:-5100}:5100"
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-qf}:${POSTGRES_PASSWORD:-qf}@postgres:5432/${POSTGRES_DB:-qsint_rag}"
      ES_HOST: "http://elasticsearch:9200"
      LLM_BASE_URL: "http://ollama:11434/v1"
      QSINT_OTLP_ENDPOINT: "http://jaeger:4317"
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      ollama:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend (dev) ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: qsint-rag-frontend
    networks: [ragnet]
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      VITE_API_BASE_URL: "http://localhost:${API_PORT:-5100}"
    volumes:
      - ./frontend/src:/app/src:ro
    depends_on:
      - backend
    restart: unless-stopped
