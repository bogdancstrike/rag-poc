# docker-compose-llm.yml — Standalone vLLM serving stack.
#
# vLLM is the production-grade LLM server we deploy on the dedicated GPU box
# (e.g. L40S 48GB at the office). The file is intentionally self-contained
# with its own network so it can run:
#
#   1) Alongside the main app compose on the same host
#         docker compose -f docker-compose-llm.yml up -d
#         (and the app reaches it via the published port on localhost)
#
#   2) On a *separate* server — the deployment for the office L40S box.
#         Bring this file up there, then point the app's .env at it:
#         LLM_BASE_URL=http://<vllm-host>:8000/v1
#
# vLLM exposes an OpenAI-compatible HTTP API at /v1 (chat/completions, models,
# embeddings if configured). Drop-in for the SGLang server we removed.
#
# GPU prerequisite: nvidia-container-toolkit installed on the host.

networks:
  llmnet:
    name: qsint-rag-llmnet

volumes:
  vllm-models: {}
  tei-data:    {}

services:

  # ── vLLM (OpenAI-compatible LLM server) ─────────────────────────────────────
  # Default model is Qwen3-4B-AWQ to match what the SGLang stack served. Swap
  # via VLLM_MODEL in .env (e.g. Qwen2.5-14B-Instruct-AWQ on the L40S).
  vllm:
    image: vllm/vllm-openai:latest
    container_name: qsint-rag-vllm
    networks: [llmnet]
    ports:
      - "${VLLM_PORT:-8000}:8000"
    volumes:
      - vllm-models:/root/.cache/huggingface
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
      # vLLM picks up these too — kept here so they appear in `env` for
      # debuggability inside the container.
      - VLLM_MODEL=${VLLM_MODEL:-Qwen/Qwen3-4B-AWQ}
    # GPU passthrough — requires nvidia-container-toolkit on host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # ipc=host avoids vLLM's shared-memory complaints under default Docker.
    ipc: host
    # Tunables below are sized for an L40S (48 GB). For smaller cards lower
    # --gpu-memory-utilization and shrink --max-model-len. The key flags:
    #   --quantization awq_marlin    — fast AWQ kernel
    #   --enforce-eager              — disable CUDA graphs while debugging
    #                                  (remove for max throughput)
    #   --enable-chunked-prefill     — better latency under concurrency
    command: >
      --model ${VLLM_MODEL:-Qwen/Qwen3-4B-AWQ}
      --host 0.0.0.0
      --port 8000
      --quantization awq_marlin
      --dtype half
      --gpu-memory-utilization ${VLLM_GPU_UTIL:-0.50}
      --max-model-len ${VLLM_MAX_MODEL_LEN:-14336}
      --max-num-seqs ${VLLM_MAX_NUM_SEQS:-16}
      --enable-chunked-prefill
      --kv-cache-dtype fp8_e5m2
      --served-model-name ${VLLM_MODEL:-Qwen/Qwen3-4B-AWQ}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 180s
    restart: unless-stopped

  # ── TEI (Text Embeddings Inference) — GPU embedding server ──────────────────
  # Runs BAAI/bge-m3 on the GPU. bge-m3 keeps the 1024-dim vector shape used
  # by the Elasticsearch mapping while supporting an ~8k-token input window.
  # alongside vLLM. Replaces the in-process CPU fastembed path on production
  # boxes — a 4417-doc embed that takes ~90s on CPU finishes in <5s on an
  # L40S.
  #
  # The two GPU services share the same physical card. bge-m3 is larger than
  # bge-large-en-v1.5, but still fits on the local RTX 3080 when vLLM uses the
  # reduced 10GB profile. The default ``VLLM_GPU_UTIL=0.50`` and
  # ``VLLM_MAX_MODEL_LEN=14336`` are sized for an RTX 3080 (10GB) so vLLM +
  # TEI both fit. On an L40S (48GB) you can safely raise VLLM_GPU_UTIL to
  # 0.90 and VLLM_MAX_MODEL_LEN to 32768 via .env. If TEI logs
  # "CUDA_ERROR_OUT_OF_MEMORY → Using CPU instead" then vLLM took too much
  # — drop ``VLLM_GPU_UTIL`` until both services start clean.
  # Tag 1.7+ fixes a hf-hub-0.3.2 "relative URL without a base" bug that
  # bites 1.5 on first model download. Bumps must keep the GPU variant
  # (CUDA 12); the CPU image is ``-cpu`` suffixed.
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:1.7
    container_name: qsint-rag-embeddings
    networks: [llmnet]
    ports:
      - "${TEI_PORT:-8080}:80"
    volumes:
      - tei-data:/data
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # bge-m3 has a CLS pooling config in the model repo. ``--auto-truncate``
    # accepts longer documents and truncates them at the model's ~8k-token
    # limit instead of returning a 4xx response. ``--max-batch-tokens`` sets
    # a soft GPU-memory ceiling.
    command: >
      --model-id ${TEI_MODEL:-BAAI/bge-m3}
      --pooling cls
      --max-batch-tokens 16384
      --auto-truncate
      --hostname 0.0.0.0
      --port 80
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 120s
    restart: unless-stopped
